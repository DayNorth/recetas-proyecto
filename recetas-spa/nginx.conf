server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # La API (mismo origen: no hace falta CORS desde este contenedor)
    location /api/ {
        proxy_pass http://recetas-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imágenes y documentos subidos (los sirve la API)
    location /uploads/ {
        proxy_pass http://recetas-api:8080;
        proxy_set_header Host $host;
    }

    # Subidas de hasta 12 MB (receta con imagen)
    client_max_body_size 12m;

    # Aplicación de una sola página: cualquier otra ruta vuelve a index.html
    location / {
        try_files $uri /index.html;
    }
}
